def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// The NDK location is machine-specific, so it is kept in local.properties
// (gitignored) rather than committed. We use a custom key `ra2.ndkPath` (NOT
// `ndk.dir`, which AGP reads on its own -> a "[CXX1100] both set" conflict)
// and feed it to android.ndkPath below. If absent, AGP falls back to an
// SDK-managed NDK.
def ndkDirProp = null
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    def props = new Properties()
    localPropsFile.withInputStream { props.load(it) }
    ndkDirProp = props.getProperty('ra2.ndkPath')
}

// W2-AR-11/-23: ONE version source -- the repo's VERSION file (semver) for
// versionName and the commit count for versionCode (the manifest no longer
// repeats them). The native RA2_VERSION string adds the git hash (CMake).
def ra2VersionName = rootProject.file('../VERSION').text.trim()
def ra2VersionCode = 1
try {
    def p = ['git', '-C', rootProject.file('..').absolutePath, 'rev-list', '--count', 'HEAD'].execute()
    p.waitFor()
    if (p.exitValue() == 0) ra2VersionCode = p.text.trim().toInteger()
} catch (ignored) { }

// W2-AR-11: release signing from keystore.properties (gitignored):
//   storeFile=<path>  storePassword=...  keyAlias=...  keyPassword=...
// Without it the release APK is signed with the debug key (side-load /
// emulator testing only -- Play needs the real upload key).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = null
if (keystorePropsFile.exists()) {
    keystoreProps = new Properties()
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    if (buildAsApplication) {
        namespace "org.ra2.engine"
    }
    // W2-AR-11: Play requires targetSdk 35 (Android 15) for new apps/updates.
    compileSdk 35
    // Must match the NDK that ndkPath points at (r27c = 27.2.12479018),
    // otherwise AGP errors [CXX1100] on the version mismatch vs its default.
    ndkVersion "27.2.12479018"
    if (ndkDirProp != null) {
        ndkPath ndkDirProp
    }
    defaultConfig {
        if (buildAsApplication) {
            applicationId "org.ra2.engine"
        }
        minSdk 21
        targetSdk 35
        versionCode ra2VersionCode
        versionName ra2VersionName
        // arm64-v8a is the real-device target; x86_64 is added so the same APK
        // runs in an accelerated Android emulator on an x86_64 host (the current
        // emulator cannot run arm64 images on x86 hosts) and on x86 Android
        // devices/Chromebooks. abiFilters here restricts the native build; the
        // ndk block below restricts what gets packaged.
        externalNativeBuild {
            cmake {
                // W2-AR-11: 16 KB page-size-compatible ELF segments (NDK r27
                // switch; r28+ does it by default). Required by Play for apps
                // targeting Android 15+ and to load at all on 16 KB devices.
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    signingConfigs {
        if (keystoreProps != null) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    // W2-AR-13/-02: the native code is OPTIMISED in both build types (the old
    // debug APK was -O0: a ~9 minute game start on the emulator). Debug keeps
    // -g and SDL's internal asserts (logged by the engine's non-blocking
    // handler, W2-AR-30); release drops both.
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    // -Pra2.nativeBuildType=Debug gives the old -O0 native code
                    // back (native debugging; the W2-AR-02 "before" timing).
                    arguments "-DCMAKE_BUILD_TYPE=" + (project.findProperty('ra2.nativeBuildType') ?: 'RelWithDebInfo'),
                              "-DSDL_ASSERTIONS=enabled"
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps != null ? signingConfigs.release : signingConfigs.debug
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release", "-DSDL_ASSERTIONS=release"
                }
            }
        }
    }
    // W2-AR-25: Java 17 (source/target 8 is obsolete on JDK 21).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
