def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// The NDK location is machine-specific, so it is kept in local.properties
// (gitignored) rather than committed. We use a custom key `ra2.ndkPath` (NOT
// `ndk.dir`, which AGP reads on its own -> a "[CXX1100] both set" conflict)
// and feed it to android.ndkPath below. If absent, AGP falls back to an
// SDK-managed NDK.
def ndkDirProp = null
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    def props = new Properties()
    localPropsFile.withInputStream { props.load(it) }
    ndkDirProp = props.getProperty('ra2.ndkPath')
}

// W2-AR-11/-23: ONE version source -- the repo's VERSION file (semver) for
// versionName and versionCode (the manifest no longer repeats them).
// W6-06-15: versionCode = major*10000000 + minor*100000 + patch*1000 + build
// (build = -Pra2.buildNumber=0..999, default 0), NOT the commit count: a
// build from a branch with fewer commits (or a shallow clone, count 1) was a
// downgrade the phone refused. 0.9.0 -> 900000, above every commit-count
// code shipped before (~1000), so the installed builds update in place. The native RA2_VERSION string adds the git hash (CMake).
// W4-AM-12: versionName also carries the commit ("0.9.0+g1a2b3c4", "-dirty"
// with local edits) so two builds can be told apart in Settings > Apps; the
// SAME string is passed to the native build as RA2_VERSION (shown on the main
// menu, in the logcat banner and by --version).
def ra2VersionBase = rootProject.file('../VERSION').text.trim()
def ra2VersionName = ra2VersionBase
def ra2VersionCode = 1
def ra2Git = { List<String> args ->
    try {
        def p = (['git', '-C', rootProject.file('..').absolutePath] + args).execute()
        def out = p.text.trim()
        p.waitFor()
        return p.exitValue() == 0 ? out : null
    } catch (ignored) { return null }
}
def ra2Semver = (ra2VersionBase =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!ra2Semver.find()) throw new GradleException("VERSION must start with MAJOR.MINOR.PATCH: '" + ra2VersionBase + "'")
def ra2Build = (project.findProperty('ra2.buildNumber') ?: '0').toString().toInteger()
if (ra2Build < 0 || ra2Build > 999) throw new GradleException("ra2.buildNumber must be 0..999")
ra2VersionCode = ra2Semver.group(1).toInteger() * 10000000 + ra2Semver.group(2).toInteger() * 100000 +
                 ra2Semver.group(3).toInteger() * 1000 + ra2Build
def ra2Desc = ra2Git(['describe', '--always', '--dirty', '--abbrev=7'])
if (ra2Desc) ra2VersionName = ra2VersionBase + '+g' + ra2Desc

// W2-AR-11: release signing from keystore.properties (gitignored):
//   storeFile=<path>  storePassword=...  keyAlias=...  keyPassword=...
// W6-06-15: without it assembleRelease FAILS (a debug-signed "release"
// can never be updated by a properly signed one), unless
// -Pra2.allowDebugSigning=true asks for a debug-key release on purpose
// (side-load / emulator testing). The key itself is user decision U-4.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = null
if (keystorePropsFile.exists()) {
    keystoreProps = new Properties()
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Use a public build property: IDE injected ABI options can mark APKs testOnly.
def ra2Abis = (project.findProperty('ra2.abis') ?: 'arm64-v8a,x86_64').toString().split(',').collect { it.trim() }
if (!ra2Abis || ra2Abis.any { !(it in ['arm64-v8a', 'x86_64']) }) {
    throw new GradleException('ra2.abis must contain arm64-v8a and/or x86_64')
}

android {
    if (buildAsApplication) {
        namespace "org.ra2.engine"
    }
    // W2-AR-11: Play requires targetSdk 35 (Android 15) for new apps/updates.
    compileSdk 35
    // Must match the NDK that ndkPath points at (r27c = 27.2.12479018),
    // otherwise AGP errors [CXX1100] on the version mismatch vs its default.
    ndkVersion "27.2.12479018"
    if (ndkDirProp != null) {
        ndkPath ndkDirProp
    }
    defaultConfig {
        if (buildAsApplication) {
            applicationId "org.ra2.engine"
        }
        minSdk 21
        targetSdk 35
        versionCode ra2VersionCode
        versionName ra2VersionName
        // arm64-v8a is the real-device target; x86_64 is added so the same APK
        // runs in an accelerated Android emulator on an x86_64 host (the current
        // emulator cannot run arm64 images on x86 hosts) and on x86 Android
        // devices/Chromebooks. abiFilters here restricts the native build; the
        // ndk block below restricts what gets packaged.
        externalNativeBuild {
            cmake {
                // W2-AR-11: 16 KB page-size-compatible ELF segments (NDK r27
                // switch; r28+ does it by default). Required by Play for apps
                // targeting Android 15+ and to load at all on 16 KB devices.
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DRA2_VERSION=" + ra2VersionName
                // -Pra2.jobs=N caps the native build's parallel compiles (a
                // machine running several builds at once runs out of memory
                // at ninja's default of one job per core).
                if (project.findProperty('ra2.jobs')) {
                    arguments "-DCMAKE_JOB_POOLS=ra2=" + project.findProperty('ra2.jobs'),
                              "-DCMAKE_JOB_POOL_COMPILE=ra2", "-DCMAKE_JOB_POOL_LINK=ra2"
                }
                abiFilters(*ra2Abis)
            }
        }
        ndk {
            abiFilters(*ra2Abis)
        }
    }
    signingConfigs {
        if (keystoreProps != null) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    // W2-AR-13/-02: the native code is OPTIMISED in both build types (the old
    // debug APK was -O0: a ~9 minute game start on the emulator). Debug keeps
    // -g and SDL's internal asserts (logged by the engine's non-blocking
    // handler, W2-AR-30); release drops both.
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    // -Pra2.nativeBuildType=Debug gives the old -O0 native code
                    // back (native debugging; the W2-AR-02 "before" timing).
                    arguments "-DCMAKE_BUILD_TYPE=" + (project.findProperty('ra2.nativeBuildType') ?: 'RelWithDebInfo'),
                              "-DSDL_ASSERTIONS=enabled"
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps != null ? signingConfigs.release : signingConfigs.debug
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release", "-DSDL_ASSERTIONS=release"
                }
            }
        }
    }
    // W2-AR-25: Java 17 (source/target 8 is obsolete on JDK 21).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // W6-06-16: LICENSE + THIRD_PARTY_NOTICES.md ship in the APK's assets/
    // (the same texts are embedded in the engine's Options > About page).
    sourceSets.main.assets.srcDirs += ["$buildDir/generated/ra2-notices"]
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"].dependsOn("ra2CopyNotices")
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path 'jni/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

// W6-06-15: refuse a release build signed with the debug key (see above).
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name ==~ /(assemble|bundle|package)Release/ }
    if (wantsRelease && keystoreProps == null && project.findProperty('ra2.allowDebugSigning') != 'true') {
        throw new GradleException("Release signing: android/keystore.properties is missing (storeFile, " +
                "storePassword, keyAlias, keyPassword). Pass -Pra2.allowDebugSigning=true for a test build " +
                "signed with the debug key.")
    }
}

// W6-06-16: copy the licence + notices into the generated assets folder.
tasks.register('ra2CopyNotices', Copy) {
    from(rootProject.file('../LICENSE'))
    from(rootProject.file('../THIRD_PARTY_NOTICES.md'))
    into("$buildDir/generated/ra2-notices")
}
// Every lint task reads the generated assets folder (the release "vital"
// lint model/report tasks, which a debug build never runs), so it must run
// after the copy; otherwise Gradle 8 refuses the release build.
tasks.configureEach { t ->
    if (t.name.toLowerCase().contains('lint') && t.name != 'ra2CopyNotices') {
        t.dependsOn('ra2CopyNotices')
    }
}
